services:
  db:
    image: postgres:16-alpine
    container_name: amigo-invisible-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amigo_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amigo_test"]
      interval: 2s
      timeout: 5s
      retries: 20
